name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install All Dependencies (Including Native Plugins)
        run: npm install @capacitor/android llama-cpp-capacitor @capacitor/filesystem --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Ensure Android Platform Exists
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder missing. Adding platform..."
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK Licenses
        uses: SimonMarquis/android-accept-licenses@v1

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK (Generates Keystore)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Print SHA-1 Fingerprint for Firebase
        run: |
          cd android
          ./gradlew signingReport

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSG
          path: android/app/build/outputs/apk/debug/app-debug.apk
