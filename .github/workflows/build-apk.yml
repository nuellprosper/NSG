name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install All Dependencies (Including Native Plugins & Assets)
        run: npm install @capacitor/android llama-cpp-capacitor @capacitor/filesystem @capacitor/assets --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Ensure Android Platform Exists
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Gradlew missing. Preserving custom configs and generating android platform..."
            mkdir -p /tmp/android-backup
            [ -f "android/app/google-services.json" ] && cp android/app/google-services.json /tmp/android-backup/
            [ -f "android/app/src/main/res/values/strings.xml" ] && cp android/app/src/main/res/values/strings.xml /tmp/android-backup/
            [ -f "android/app/debug.keystore" ] && cp android/app/debug.keystore /tmp/android-backup/

            rm -rf android
            npx cap add android

            [ -f "/tmp/android-backup/google-services.json" ] && cp /tmp/android-backup/google-services.json android/app/google-services.json
            [ -f "/tmp/android-backup/debug.keystore" ] && cp /tmp/android-backup/debug.keystore android/app/debug.keystore
            if [ -f "/tmp/android-backup/strings.xml" ]; then
              mkdir -p android/app/src/main/res/values
              cp /tmp/android-backup/strings.xml android/app/src/main/res/values/strings.xml
            fi
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate App Icons from Logo
        run: |
          # Runs safely AFTER Android platform and Manifest exist
          if [ -f "public/logo.png" ]; then
            npx @capacitor/assets generate --iconPath public/logo.png --android
          elif [ -f "public/icon.png" ]; then
            npx @capacitor/assets generate --iconPath public/icon.png --android
          elif [ -f "assets/logo.png" ]; then
            npx @capacitor/assets generate --iconPath assets/logo.png --android
          elif [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --iconPath assets/icon.png --android
          else
            echo "⚠️ Warning: No logo.png or icon.png found in public/ or assets/. Skipping icon generation."
          fi

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK Licenses
        uses: SimonMarquis/android-accept-licenses@v1

      - name: Setup Permanent Debug Keystore
        run: |
          mkdir -p ~/.android
          mkdir -p android/app
          if [ ! -f "android/app/debug.keystore" ]; then
            echo "Generating permanent keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/debug.keystore
            git commit -m "Save permanent debug keystore for fixed SHA-1 [skip ci]" || echo "No changes to commit"
            git push || echo "Push skipped or already up to date"
          fi
          cp android/app/debug.keystore ~/.android/debug.keystore

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK (Generates Keystore)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Print SHA-1 Fingerprint for Firebase
        run: |
          cd android
          ./gradlew signingReport

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSG
          path: android/app/build/outputs/apk/debug/app-debug.apk
