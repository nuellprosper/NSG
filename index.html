    <!-- Global Error Shield for third-party scripts & iframe environments -->
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        if (message === 'Script error.' || !source || source.indexOf(window.location.origin) === -1) {
          // Suppress cross-origin / third-party ad / external script errors in sandboxed iframes
          return true;
        }
        return false;
      };
      window.addEventListener('error', function(e) {
        if (!e || e.message === 'Script error.' || !e.filename || e.filename.indexOf(window.location.origin) === -1) {
          if (e && e.preventDefault) e.preventDefault();
          if (e && e.stopImmediatePropagation) e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (e.reason.message === 'Script error.' || String(e.reason).includes('Failed to fetch') || String(e.reason).includes('Load failed') || String(e.reason).includes('Script error'))) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      });
    </script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              if (reg.active) reg.update();
            })
            .catch(err => {
              // Non-blocking in sandboxed environments
            });
        });
      }
    </script>

  <body class="bg-[#0B0813] text-[#F0F4FF] min-h-screen antialiased" style="background-color: #0B0813; color: #F0F4FF; margin: 0; padding: 0;">
    <div id="root">
      <!-- Fallback dark loading state with auto-recovery failsafe -->
      <div id="initial-loader" style="min-height: 100vh; background-color: #0B0813; color: #F0F4FF; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'DM Sans', system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(220, 38, 38, 0.2); border-top-color: #DC2626; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p id="loader-msg" style="margin-top: 16px; font-size: 14px; font-weight: 600; color: rgba(240, 244, 255, 0.9);">Loading pls wait</p>
        <div id="loader-fallback-actions" style="display: none; margin-top: 20px; flex-direction: column; align-items: center; gap: 10px;">
          <p style="font-size: 12px; color: rgba(240, 244, 255, 0.5); max-width: 320px;">Taking longer than expected? You can refresh or clear corrupted browser cache:</p>
          <button onclick="localStorage.removeItem('nsg_current_quiz_progress'); localStorage.removeItem('nsg_tools_subtab'); localStorage.removeItem('nsg_active_tab'); window.location.reload();" style="background: #DC2626; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em;">Clear Cache & Reload</button>
        </div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
        <script>
          setTimeout(function() {
            var actions = document.getElementById('loader-fallback-actions');
            if (actions && document.getElementById('initial-loader')) {
              actions.style.display = 'flex';
            }
          }, 6000);
          window.addEventListener('error', function(e) {
            // Ignore generic cross-origin Script error (e.g., ad blockers, external analytics)
            if (!e || e.message === 'Script error.' || !e.filename) {
              return;
            }
            console.warn('Recoverable script issue during startup:', e.message);
          });
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
