<!doctype html>
<html lang="en" data-theme="dark" style="background-color: #0B0813; color: #F0F4FF;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google-signin-client_id" content="780956680320-9b5d20e4fb6227a1a4a665.apps.googleusercontent.com" />
    <title>Omni | NextGen Study Guide</title>
    <meta name="description" content="Omni Academic Platform - Your ultimate AI-powered study companion. Generate smart quizzes, host CBT exams, transcribe lectures, and solve assignments." />
    
    <!-- OpenGraph / Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nuellstudyguide.name.ng/" />
    <meta property="og:title" content="Omni | Academic Smart Quiz & Study Assistant" />
    <meta property="og:description" content="Take interactive AI-generated quizzes, CBT exams, and access smart study tools on Omni." />
    <meta property="og:image" content="https://nuellstudyguide.name.ng/preview-card.png" />
    <meta property="og:image:secure_url" content="https://nuellstudyguide.name.ng/preview-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Omni" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Omni | Academic Smart Quiz & Study Assistant" />
    <meta name="twitter:description" content="Take interactive AI-generated quizzes, CBT exams, and access smart study tools on Omni." />
    <meta name="twitter:image" content="https://nuellstudyguide.name.ng/preview-card.png" />

    <!-- Google AdSense -->
    <meta name="google-adsense-account" content="ca-pub-3216169026195971">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3216169026195971" crossorigin="anonymous"></script>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0813" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NSG" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('SW registered:', reg);
              if (reg.active) reg.update();
            })
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
  </head>
  <body class="bg-[#0B0813] text-[#F0F4FF] min-h-screen antialiased" style="background-color: #0B0813; color: #F0F4FF; margin: 0; padding: 0;">
    <div id="root">
      <!-- Fallback dark loading state with auto-recovery failsafe -->
      <div id="initial-loader" style="min-height: 100vh; background-color: #0B0813; color: #F0F4FF; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'DM Sans', system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(220, 38, 38, 0.2); border-top-color: #DC2626; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p id="loader-msg" style="margin-top: 16px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(240, 244, 255, 0.7);">Loading Omni, please wait...</p>
        <div id="loader-fallback-actions" style="display: none; margin-top: 20px; flex-direction: column; align-items: center; gap: 10px;">
          <p style="font-size: 12px; color: rgba(240, 244, 255, 0.5); max-width: 320px;">Taking longer than expected? You can refresh or clear corrupted browser cache:</p>
          <button onclick="localStorage.removeItem('nsg_current_quiz_progress'); localStorage.removeItem('nsg_tools_subtab'); localStorage.removeItem('nsg_active_tab'); window.location.reload();" style="background: #DC2626; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em;">Clear Cache & Reload</button>
        </div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
        <script>
          setTimeout(function() {
            var actions = document.getElementById('loader-fallback-actions');
            if (actions && document.getElementById('initial-loader')) {
              actions.style.display = 'flex';
            }
          }, 4500);
          window.addEventListener('error', function(e) {
            console.error('Window error during load:', e);
            var actions = document.getElementById('loader-fallback-actions');
            if (actions) actions.style.display = 'flex';
          });
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
