<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NSG | Nuell Study Guide</title>
    
    <!-- Standard Meta Description (Cleaned up for Search Engines) -->
    <meta name="description" content="NSG (Nuell Study Guide) is the ultimate AI-powered academic companion built for modern students. Transform your education by recording and transcribing lectures in real time, chatting with interactive AI study tutors, generating and sharing custom quizzes, sitting for realistic CBT exams, converting study notes into audio podcasts, and collaborating seamlessly with classmates—all in one smart ecosystem." />
    
    <!-- OpenGraph / Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nuellstudyguide.name.ng/" />
    <meta property="og:title" content="NSG | Nuell Study Guide" />
    <meta property="og:description" content="The ultimate AI academic companion. Record lectures, host classes, generate and share quizzes, take CBT exams, create study podcasts, and chat with peers." />
    <meta property="og:image" content="https://nuellstudyguide.name.ng/preview-card.png" />

    <!-- Google AdSense -->
    <meta name="google-adsense-account" content="ca-pub-3216169026195971">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3216169026195971" crossorigin="anonymous"></script>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#13111C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NSG" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => console.log('SW registered successfully with scope:', reg.scope))
            .catch(err => console.error('SW registration failed:', err));
        });
      }
    </script>
